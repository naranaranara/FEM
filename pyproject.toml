[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "rimls-contact"
version = "0.1.0"
description = "RIMLS contact geometry and Hessian research core"
requires-python = ">=3.8"
dependencies = ["numpy", "scipy>=1.7", "torch>=1.9", "threadpoolctl>=3.0"]

[project.optional-dependencies]
pardiso = ["pypardiso>=0.4.7,<0.5"]
collision = ["ipctk==1.3.0"]
visualization = ["matplotlib"]

[tool.setuptools.packages.find]
where = ["."]
include = ["src", "src.*"]
